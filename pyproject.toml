[project]
name = "claimsight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JoseA", email = "jose.angarita11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
claimsight = "claimsight:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
